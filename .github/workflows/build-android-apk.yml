name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Test native Kotlin calculator engine
        run: gradle --no-daemon testDebugUnitTest

      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/fx82ms-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fx82ms-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: fx82ms Calculator ${{ github.ref_name }}
          body: |
            Android APK for the fx82ms scientific calculator.

            Install the APK on Android to use the fully native Kotlin calculator offline. This is a debug-signed sideload build.
          files: app/build/outputs/apk/debug/fx82ms-debug.apk
          fail_on_unmatched_files: true
